<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-labelledby="t d" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
  <title id="t">Wireframe: Bereich mit Schrittfolge, schmale Ansicht (390 px)</title>
  <desc id="d">Grunddesign der App-Familie (design/README.md). Unter 640 px steht die Hauptnavigation in einer eigenen Zeile und bricht um; unter 860 px steht die Schrittleiste waagerecht über der Arbeitsfläche, ist scrollbar und zeigt am Rand einen Verlauf. Graustufen, keine Farbwerte. © 2026 Heiko Pereira Wolf, CC BY 4.0.</desc>
  <style>
    .papier { fill: #F5F6F7 } .flaeche { fill: #FFFFFF; stroke: #CFD5DB } .linie { stroke: #CFD5DB; fill: none }
    .tinte { fill: #20252B } .leise { fill: #4F5965 } .amt { fill: #3D4A59 } .amt-zart { fill: #E3E7EC } .auf-amt { fill: #FFFFFF }
    .regel { fill: #8A6400; font-size: 10px } .t { font-size: 14px } .k { font-size: 12px } .h1 { font-size: 22px; font-weight: 700 } .h2 { font-size: 19px; font-weight: 700 } .b { font-weight: 700 }
  </style>
  <defs>
    <linearGradient id="verlauf" x1="0" x2="1"><stop offset="0" stop-color="#F5F6F7" stop-opacity="0"/><stop offset="1" stop-color="#CFD5DB"/></linearGradient>
  </defs>
  <rect class="papier" width="390" height="844"/>
  <!-- Kopfleiste: erste Zeile Marke und Status, zweite Zeile Hauptnavigation (LD-N05) -->
  <text class="tinte b" x="16" y="30" font-size="18">Produktname</text>
  <rect x="270" y="12" width="104" height="26" rx="13" class="amt-zart" stroke="#3D4A59"/><text class="tinte k" x="286" y="30">Status ruht</text>
  <rect class="amt-zart" x="12" y="46" width="82" height="28" rx="4"/><text class="tinte b k" x="20" y="65" text-decoration="underline">Schritt A</text>
  <text class="leise b k" x="104" y="65">Schritt B</text><text class="leise b k" x="186" y="65">Schritt C</text><text class="leise b k" x="268" y="65">Profile</text>
  <text class="leise b k" x="20" y="95">Einstellungen</text>
  <text class="regel" x="130" y="95">umbrechend, vollständig (LD-N05)</text>
  <!-- Identitätsband, Hinweisband -->
  <rect x="0" y="106" width="130" height="8" fill="#6B7785"/><rect x="130" y="106" width="130" height="8" fill="#A3ADB8"/><rect x="260" y="106" width="130" height="8" fill="#6B7785"/>
  <rect x="0" y="114" width="390" height="40" fill="#30363D"/>
  <text x="16" y="127" font-size="11" fill="#FFFFFF"><tspan font-weight="700">Forschungsdemonstrator</tspan> · Nur fiktive oder offen zugängliche</text><text x="16" y="139" font-size="11" fill="#FFFFFF">Inhalte verwenden – keine personenbezogenen und keine</text><text x="16" y="151" font-size="11" fill="#FFFFFF">eingestuften Daten.</text>
  <!-- Seitenkopf -->
  <text class="tinte h1" x="16" y="186">Bereichsname</text>
  <text class="leise t" x="16" y="208">Kennsatz: Tätigkeit nach Methode</text>
  <rect class="flaeche" x="16" y="220" width="170" height="44" rx="4" stroke="#3D4A59"/><text class="tinte b t" x="34" y="247">Aktion</text>
  <rect class="flaeche" x="196" y="220" width="178" height="44" rx="4" stroke="#3D4A59"/><text class="tinte b t" x="214" y="247">Aktion</text>
  <text class="leise k" x="16" y="286">Profil: Name 1.0 · Profile</text>
  <!-- Schrittleiste waagerecht (LD-A03) -->
  <line x1="16" y1="340" x2="374" y2="340" stroke="#CFD5DB" stroke-width="2"/>
  <line x1="16" y1="340" x2="122" y2="340" stroke="#3D4A59" stroke-width="2"/>
  <circle class="amt" cx="32" cy="318" r="12"/><text class="auf-amt b k" x="28" y="322">1</text><text class="tinte b t" x="50" y="323">Schritt 1</text>
  <circle cx="148" cy="318" r="12" fill="none" stroke="#B3261E" stroke-width="1.5"/><text class="k" x="144" y="322" fill="#B3261E">2</text><text class="leise t" x="166" y="323">Schritt 2</text>
  <circle cx="264" cy="318" r="12" fill="none" stroke="#CFD5DB" stroke-width="1.5"/><text class="leise k" x="260" y="322">3</text><text class="leise t" x="282" y="323">Schritt 3</text>
  <rect x="350" y="300" width="40" height="40" fill="url(#verlauf)"/>
  <text class="regel" x="16" y="356">waagerecht, scrollbar, Verlauf am Rand (LD-A03)</text>
  <!-- Arbeitsfläche -->
  <rect class="flaeche" x="12" y="368" width="366" height="400" rx="8"/>
  <text class="tinte h2" x="24" y="400">Schritt 1</text>
  <text class="leise t" x="24" y="424">Einleitung des Schritts</text>
  <text class="tinte b t" x="24" y="460">Beschriftung</text>
  <text class="leise k" x="24" y="480">Hilfetext</text>
  <rect class="flaeche" x="24" y="490" width="342" height="44" rx="4" stroke="#69737D"/>
  <text class="k" x="24" y="554" fill="#B3261E">Fehlertext</text>
  <rect x="24" y="572" width="342" height="56" rx="8" fill="#E3E7EC" stroke="#CFD5DB"/><rect x="24" y="572" width="5" height="56" class="amt"/>
  <text class="tinte k" x="40" y="604">Kasten: Information</text>
  <line class="linie" x1="24" y1="652" x2="366" y2="652"/>
  <text class="tinte b t" x="24" y="695">Zurück: Titel</text>
  <rect class="amt" x="196" y="668" width="170" height="44" rx="4"/><text class="auf-amt b t" x="214" y="695">Weiter: Titel</text>
  <text class="regel" x="24" y="740">Zielgröße 44 px bei grober Zeigereingabe (LD-B01)</text>
  <!-- Fußzeile -->
  <text class="leise" x="195" y="800" font-size="11" text-anchor="middle">Produktname Fassung · Datenhinweis</text>
  <text class="leise" x="195" y="816" font-size="11" text-anchor="middle">Lizenzen · Impressum · Datenschutz</text>
</svg>
