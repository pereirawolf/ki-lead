<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
  <title id="t">Wireframe: Bereich mit Schrittfolge, breite Ansicht (1280 px)</title>
  <desc id="d">Grunddesign der App-Familie (design/README.md). Kopfleiste mit Produktname, Hauptnavigation und Statusanzeige; Identitätsband; Hinweisband in der tiefen Aktionsfarbe, mit der Kopfleiste mitlaufend; Seitenkopf mit Überschrift, Kennsatz, Aktionen und Profilzeile; Arbeitsbereich mit nummerierter Schrittleiste links und Arbeitsfläche als Karte; Fußzeile. Graustufen, keine Farbwerte: Farben kommen aus den Farbrollen. © 2026 Heiko Pereira Wolf, CC BY 4.0.</desc>
  <style>
    .papier { fill: #F5F6F7 } .flaeche { fill: #FFFFFF; stroke: #CFD5DB } .linie { stroke: #CFD5DB; fill: none }
    .tinte { fill: #20252B } .leise { fill: #4F5965 } .amt { fill: #3D4A59 } .amt-zart { fill: #E3E7EC } .auf-amt { fill: #FFFFFF }
    .regel { fill: #8A6400; font-size: 11px } .t { font-size: 15px } .k { font-size: 13px } .h1 { font-size: 26px; font-weight: 700 } .h2 { font-size: 21px; font-weight: 700 } .b { font-weight: 700 }
  </style>
  <rect class="papier" width="1280" height="800"/>
  <!-- Kopfleiste (LD-R02), mitlaufend -->
  <rect class="papier" x="0" y="0" width="1280" height="56"/>
  <text class="tinte b" x="16" y="35" font-size="20">Produktname</text>
  <text class="leise k" x="158" y="35">Zusatz</text>
  <rect class="amt-zart" x="214" y="14" width="98" height="30" rx="4"/>
  <text class="tinte b t" x="226" y="34" text-decoration="underline">Schritt A</text>
  <text class="leise b t" x="330" y="34">Schritt B</text>
  <text class="leise b t" x="430" y="34">Schritt C</text>
  <text class="leise b t" x="530" y="34">Profile</text>
  <text class="leise b t" x="610" y="34">Einstellungen</text>
  <rect x="1140" y="14" width="124" height="28" rx="14" class="amt-zart" stroke="#3D4A59"/>
  <text class="tinte k" x="1162" y="33">Status ruht</text>
  <text class="regel" x="716" y="34">LD-R02, LD-N01, LD-M03</text>
  <!-- Identitätsband (LD-R03) -->
  <rect x="0" y="56" width="427" height="8" fill="#6B7785"/><rect x="427" y="56" width="426" height="8" fill="#A3ADB8"/><rect x="853" y="56" width="427" height="8" fill="#6B7785"/>
  <!-- Hinweisband (LD-R04), Fläche amt-tief, Text auf-amt-hover; mit Kopfleiste und Identitätsband mitlaufend (LD-R01) -->
  <rect x="0" y="64" width="1280" height="28" fill="#30363D"/>
  <text class="k" x="16" y="83" fill="#FFFFFF"><tspan font-weight="700">Forschungsdemonstrator</tspan> · Nur fiktive oder offen zugängliche Inhalte verwenden – keine personenbezogenen und keine eingestuften Daten.</text>
  <text class="k" x="1264" y="83" fill="#FFFFFF" text-anchor="end">LD-R01, LD-R04</text>
  <!-- Inhalt, höchstens 1180 px (LD-R06) -->
  <line class="linie" x1="50" y1="100" x2="50" y2="760" stroke-dasharray="4 4"/><line class="linie" x1="1230" y1="100" x2="1230" y2="760" stroke-dasharray="4 4"/>
  <text class="regel" x="1100" y="114">Inhalt ≤ 1180 px (LD-R06)</text>
  <!-- Seitenkopf (LD-A01) -->
  <text class="tinte h1" x="66" y="140">Bereichsname</text>
  <text class="leise t" x="66" y="164">Kennsatz: Tätigkeit nach Methode</text>
  <rect class="flaeche" x="940" y="122" width="130" height="44" rx="4" stroke="#3D4A59"/><text class="tinte b t" x="958" y="149">Aktion</text>
  <rect class="flaeche" x="1080" y="122" width="134" height="44" rx="4" stroke="#3D4A59"/><text class="tinte b t" x="1098" y="149">Aktion</text>
  <text class="leise k" x="66" y="190">Profil: Name 1.0 · Profile</text>
  <text class="regel" x="260" y="190">LD-A01</text>
  <!-- Leiste (LD-A03, LD-A04) -->
  <line x1="66" y1="214" x2="66" y2="420" stroke="#CFD5DB" stroke-width="2"/>
  <line x1="66" y1="214" x2="66" y2="256" stroke="#3D4A59" stroke-width="2"/>
  <circle class="amt" cx="94" cy="235" r="14"/><text class="auf-amt b k" x="90" y="240">1</text><text class="tinte b t" x="120" y="240">Schritt 1</text>
  <circle cx="94" cy="285" r="14" fill="none" stroke="#B3261E" stroke-width="1.5"/><text class="k" x="90" y="290" fill="#B3261E">2</text><circle cx="106" cy="273" r="5" fill="#B3261E" stroke="#F5F6F7" stroke-width="2"/><text class="leise t" x="120" y="290">Schritt 2</text>
  <circle cx="94" cy="335" r="14" fill="none" stroke="#CFD5DB" stroke-width="1.5"/><text class="leise k" x="90" y="340">3</text><text class="leise t" x="120" y="340">Schritt 3</text>
  <circle cx="94" cy="385" r="14" fill="none" stroke="#CFD5DB" stroke-width="1.5"/><text class="leise k" x="90" y="390">4</text><text class="leise t" x="120" y="390">Schritt 4</text>
  <text class="regel" x="66" y="440">Leiste 15 rem, mitlaufend</text><text class="regel" x="66" y="454">LD-A03, LD-A04, LD-N03</text>
  <!-- Arbeitsfläche (LD-A05) -->
  <rect class="flaeche" x="330" y="210" width="884" height="500" rx="8"/>
  <text class="tinte h2" x="354" y="248">Schritt 1</text>
  <text class="leise t" x="354" y="274">Einleitung des Schritts</text>
  <text class="tinte b t" x="354" y="316">Beschriftung</text>
  <text class="leise k" x="354" y="338">Hilfetext (aria-describedby)</text>
  <rect class="flaeche" x="354" y="348" width="600" height="40" rx="4" stroke="#69737D"/>
  <text class="k" x="354" y="408" fill="#B3261E">Fehlertext</text>
  <text class="leise k" x="354" y="428">Rückmeldungen · Werkzeuge</text>
  <text class="regel" x="980" y="372">LD-E01, LD-E02</text>
  <rect x="354" y="450" width="836" height="64" rx="8" fill="#E3E7EC" stroke="#CFD5DB"/><rect x="354" y="450" width="5" height="64" class="amt"/>
  <text class="tinte t" x="374" y="487">Kasten: Information · Hinweis · Fehler · Erfolg</text><text class="regel" x="1100" y="487">LD-M01</text>
  <line class="linie" x1="354" y1="640" x2="1190" y2="640"/>
  <rect class="flaeche" x="354" y="652" width="230" height="44" rx="4" stroke="none"/><text class="tinte b t" x="370" y="679">Zurück: Titel</text>
  <rect class="amt" x="960" y="652" width="230" height="44" rx="4"/><text class="auf-amt b t" x="984" y="679">Weiter: Titel</text>
  <text class="regel" x="620" y="679">LD-A05, LD-B01, LD-B02</text>
  <!-- Fußzeile (LD-R05) -->
  <text class="leise" x="640" y="760" font-size="12" text-anchor="middle">Produktname Fassung · Datenhinweis · Lizenzen · Impressum · Datenschutz</text>
  <text class="regel" x="640" y="778" text-anchor="middle">LD-R05</text>
</svg>
