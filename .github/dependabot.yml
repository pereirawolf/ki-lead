# Dependabot (seit 0.6.2, TP-2026-W44-08): wöchentliche Pull Requests für npm-Pakete und GitHub Actions.
# Neue Laufzeitabhängigkeiten brauchen weiter eine Lizenz aus der Positivliste (tests/lizenzen/); Aktualisierungen von
# Dev-Abhängigkeiten ändern die Tabelle in THIRD-PARTY-NOTICES.md, Abschnitt 5, die der Test mitprüft.
# Gruppen (seit 0.6.9): Pakete, die nur zusammen installierbar sind, kommen in einem Pull Request
# (react mit react-dom; alle @capacitor/*, deren Version auch in ios/App/CapApp-SPM/Package.swift steht).
# Major-Sprünge von React bleiben aus, bis die Migration auf React 19 als eigenes Vorhaben ansteht.
# GitHub Actions sind seit TP-2026-W44-36 per Commit-SHA mit Versionskommentar eingebunden; Dependabot schreibt beides fort.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      capacitor:
        patterns: ["@capacitor/*"]
      entwicklung:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
