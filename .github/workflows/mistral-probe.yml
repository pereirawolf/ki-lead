# Mistral-Probe (seit 0.5.6): echte Aufrufe an Mistral mit dem Testschlüssel im Repository-Secret MISTRAL_API_KEY.
# Prüft, was mit Attrappen nicht geht (Spezifikation, offener Punkt 15): Aufruf direkt aus dem Browser (CORS) über
# beide Endpunkte, Modelle am EU-Endpunkt, strukturierte Ausgabe, Stufen des Nachdenkens, PDF, Websuche.
#
# Start: am Pull Request das Label „mistral-probe“ setzen (erneut: Label entfernen und wieder setzen) oder, sobald
# diese Datei auf main liegt, unter „Actions“ → „Mistral-Probe“ → „Run workflow“. Läuft nie von allein.
# Seit 0.6.17 (TP-2026-W44-52) auch der Endpunkt der Stelle: Betreiberbuild mit betrieb/probe-mistral-eu.json
# (Chat Completions am EU-Endpunkt) in dist-betrieb/, Abnahme von Arbeitspaket A2.
# Ergebnis: Zusammenfassung des Laufs (probe-bericht.md, probe-bericht-stelle.md). Keine Aufzeichnungen, keine Artefakte mit Anfragen;
# GitHub maskiert den Schlüssel in den Protokollen. Kosten: wenige Cent je Lauf über das Mistral-Konto.
name: Mistral-Probe

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mistral-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'mistral-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Betreiberbuild für den Endpunkt der Stelle
        run: npx vite build --outDir dist-betrieb
        env:
          KI_LEAD_BETRIEB: betrieb/probe-mistral-eu.json
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Schlüssel vorhanden?
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -z "$MISTRAL_API_KEY" ]; then
            echo "::error::Repository-Secret MISTRAL_API_KEY fehlt (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Probe
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          KI_LEAD_BUILD_VORHANDEN: "1"
        run: npx playwright test -c playwright.probe.config.ts
      - name: Bericht
        if: always()
        run: |
          if [ -f probe-bericht.md ]; then cat probe-bericht.md >> "$GITHUB_STEP_SUMMARY"; else echo "Kein Bericht erzeugt." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f probe-bericht-stelle.md ]; then cat probe-bericht-stelle.md >> "$GITHUB_STEP_SUMMARY"; fi
          # Berichte zusätzlich als Annotation, lesbar auch über die API der Check-Runs (seit 0.6.17)
          for f in probe-bericht.md probe-bericht-stelle.md; do
            if [ -f "$f" ]; then echo "::notice title=$f::$(sed 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')"; fi
          done
