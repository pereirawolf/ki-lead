# Prüft jeden Stand und veröffentlicht den Hauptzweig als Web-App auf GitHub Pages.
# Die Veröffentlichung läuft nur, wenn die Repository-Variable PAGES_AKTIV auf true steht
# (Settings → Secrets and variables → Actions → Variables) und unter Settings → Pages
# als Source „GitHub Actions“ gewählt ist. Für private Repositories setzt Pages einen
# kostenpflichtigen GitHub-Plan voraus.
#
# Gestaffelte Prüfung (docs/TESTS.md): Auf main, im Wochenlauf und bei manuellem Start läuft immer alles.
# Auf Pull Requests entscheidet scripts/pruefumfang.mjs anhand der geänderten Dateien, ob die Kern- und die
# PWA-Browsertests nötig sind; Vitest und Build laufen immer.
name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Wöchentlicher Volllauf (montags 03:17 UTC), unabhängig von Änderungen; veröffentlicht nichts
  schedule:
    - cron: "17 3 * * 1"

# Grundrechte für alle Jobs; nur die Veröffentlichung erhält Schreibrechte für Pages.
permissions:
  contents: read

# Je Pull Request bzw. Zweig eine eigene Gruppe: Ein neuer Push bricht nur die ältere Prüfung desselben
# Pull Requests ab, nie die Prüfung oder Veröffentlichung eines anderen Zweigs. Auf main wird kein laufender
# Durchgang abgebrochen; ein noch wartender wird, wie bei GitHub üblich, durch einen neueren ersetzt.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pruefen:
    runs-on: ubuntu-latest
    outputs:
      kern: ${{ steps.umfang.outputs.kern }}
      pwa: ${{ steps.umfang.outputs.pwa }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bei Pull Requests ist HEAD der Merge-Commit; sein erster Elternteil ist die aktuelle Basis
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Prüfumfang: außerhalb von Pull Requests immer alles; scheitert die Ermittlung, ebenfalls alles
      # shell: bash setzt pipefail; nur eine vollständige, gültige Ausgabe des Skripts darf Tests auslassen.
      # --no-renames: Bei Umbenennungen zählen Quell- und Zielpfad.
      - id: umfang
        shell: bash
        env:
          EREIGNIS: ${{ github.event_name }}
        run: |
          alles() { echo "$1, prüfe alles"; printf 'kern=true\npwa=true\n' >> "$GITHUB_OUTPUT"; }
          if [ "$EREIGNIS" != "pull_request" ]; then
            alles "Kein Pull Request"
          elif ! dateien=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            alles "Basis nicht ermittelbar"
          else
            echo "Geänderte Dateien:"; echo "$dateien"
            if umfang=$(echo "$dateien" | node scripts/pruefumfang.mjs) &&
               echo "$umfang" | grep -qxE 'kern=(true|false)' && echo "$umfang" | grep -qxE 'pwa=(true|false)'; then
              echo "$umfang" | tee -a "$GITHUB_OUTPUT"
            else
              alles "Prüfumfang nicht ermittelbar"
            fi
          fi

      - run: npm ci
      # Bekannte Schwachstellen der ausgelieferten npm-Pakete (seit TP-2026-W44-37): Abbruch ab Stufe „high“; mittlere
      # Meldungen stehen im Protokoll. Entwicklungsabhängigkeiten bleiben außen vor (nicht ausgeliefert, Pflege durch Dependabot).
      - run: npm audit --omit=dev --audit-level=high
      # Stückliste der ausgelieferten npm-Pakete (CycloneDX, ohne Entwicklungsabhängigkeiten); siehe THIRD-PARTY-NOTICES.md
      - run: npm sbom --omit dev --sbom-format cyclonedx --sbom-type application --package-lock-only > ki-lead-sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ki-lead-sbom
          path: ki-lead-sbom.cdx.json
          retention-days: 90
      # Lizenzzuordnung nach REUSE (seit Issue #89): reuse in fester Version; tests/lizenzen/reuse.test.ts gleicht
      # REUSE.toml mit LICENSE-CONTENT ab und setzt reuse in der CI voraus
      - run: pipx install reuse==6.3.0
      - run: reuse lint
      # Linting und Formatierung vor den Tests (seit 0.6.2, TP-2026-W44-08); Warnungen (etwa no-explicit-any) lassen den Lauf bestehen
      - run: npm run lint
      - run: npm run format:check
      # Auf Pull Requests ein Durchgang in zufälliger, fester Reihenfolge (deckt Abhängigkeiten zwischen Tests auf);
      # auf main und im Wochenlauf zusätzlich in der gewöhnlichen Reihenfolge.
      - if: github.event_name != 'pull_request'
        run: npm test
      - run: npm run test:zufall
      - run: npm run build

      # Browsertests laufen im Job „browser“ gegen genau diesen Build; er erhält dist/ als Artefakt und die
      # Playwright-Version für das Containerbild (seit 10.11.2026, Nachtrag zu 0.7.15).
      - id: playwright
        if: steps.umfang.outputs.kern == 'true' || steps.umfang.outputs.pwa == 'true'
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.playwright.outcome == 'success'
        with:
          name: ki-lead-dist
          path: dist
          include-hidden-files: true
          retention-days: 1
      - if: steps.umfang.outputs.kern != 'true' && steps.umfang.outputs.pwa != 'true'
        run: echo "Nur Inhalte geändert (Dokumentation, SOP, Bewertungsfälle); Browsertests entfallen für diesen Pull Request und laufen nach dem Zusammenführen auf main."
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && vars.PAGES_AKTIV == 'true'
        with:
          path: dist

  # Browsertests im offiziellen Containerbild von Playwright (seit 10.11.2026, Nachtrag zu 0.7.15): Chromium, WebKit
  # und ihre Systembibliotheken sind darin enthalten. Vorher installierte jeder Lauf die Systembibliotheken über apt
  # (`playwright install-deps`, `install --with-deps webkit`); das dauerte je Schritt bis zu zehn Minuten und hing
  # wiederholt. Das Bild trägt die Version von @playwright/test aus package-lock.json, ermittelt im Job „pruefen“;
  # eine Aktualisierung von Playwright zieht das passende Bild ohne weitere Änderung nach.
  browser:
    needs: pruefen
    if: needs.pruefen.outputs.kern == 'true' || needs.pruefen.outputs.pwa == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.pruefen.outputs.playwright }}-noble
      # Nutzer des Runners (Schreibrechte im Arbeitsverzeichnis); --ipc=host gegen Abstürze von Chromium (Empfehlung von Playwright)
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ki-lead-dist
          path: dist
      # Browsertests gegen genau den Build aus „pruefen“ (Chromium, Kerntests auch WebKit; KI-Anbieter simuliert, kein Netz nach außen)
      - if: needs.pruefen.outputs.kern == 'true'
        run: npm run test:browser:kern
        env:
          KI_LEAD_BUILD_VORHANDEN: "1"
      - if: needs.pruefen.outputs.pwa == 'true'
        run: npm run test:browser:pwa
        env:
          KI_LEAD_BUILD_VORHANDEN: "1"
      # Kerntests zusätzlich in WebKit (Safari, auch iOS; seit 0.6.5, TP-2026-W44-22); blockierend, auf 20 Minuten begrenzt
      - if: needs.pruefen.outputs.kern == 'true'
        timeout-minutes: 20
        run: npm run test:browser:webkit
        env:
          KI_LEAD_BUILD_VORHANDEN: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  veroeffentlichen:
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && vars.PAGES_AKTIV == 'true'
    # Veröffentlicht nur, wenn auch die Browsertests bestanden haben
    needs: [pruefen, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Höchstens eine Veröffentlichung zugleich; eine laufende wird zu Ende geführt (Empfehlung von GitHub für Pages).
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
