# Prüft jeden Stand und veröffentlicht den Hauptzweig als Web-App auf GitHub Pages.
# Die Veröffentlichung läuft nur, wenn die Repository-Variable PAGES_AKTIV auf true steht
# (Settings → Secrets and variables → Actions → Variables) und unter Settings → Pages
# als Source „GitHub Actions“ gewählt ist. Für private Repositories setzt Pages einen
# kostenpflichtigen GitHub-Plan voraus.
name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && vars.PAGES_AKTIV == 'true'
        with:
          path: dist

  veroeffentlichen:
    if: github.ref == 'refs/heads/main' && vars.PAGES_AKTIV == 'true'
    needs: pruefen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
